name: 8min-bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests moviepy==1.0.3
      - run: python bot.py
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: 8min-video
          path: final_8min.mp4
